name: Tests

# The regression suite on every push and pull request: a plain build, a
# build without readline, and an AddressSanitizer/UBSan build on Linux
# (the suite needs GNU od), plus a build-only check with clang on macOS.
# Release packages are made by release-builds.yml, started by hand.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            make-flags: ''
          - name: clang, no readline
            cc: clang
            make-flags: READLINE=0
          - name: gcc, ASan + UBSan
            cc: gcc
            make-flags: >-
              CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
              LIBS="-lm -fsanitize=address,undefined"
    steps:
      - uses: actions/checkout@v4
      - name: Install flex, bison and readline
        run: sudo apt-get update && sudo apt-get install -y flex bison libreadline-dev
      - name: Build
        run: eval make -j"$(nproc)" CC=${{ matrix.cc }} ${{ matrix.make-flags }}
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0   # main() returns early on usage errors without freeing its argv arrays: by design
        run: eval make test CC=${{ matrix.cc }} ${{ matrix.make-flags }}
      - name: Lint the Manual Pages
        run: make mancheck
      - name: Smoke Test (package layout)
        run: sh scripts/smoke_test.sh bin lib

  macos:
    name: macOS (clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS's own bison (2.3) is too old for src/parser.y
      - name: Install flex and bison
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" CC=clang
      - name: Smoke Test (package layout)
        run: sh scripts/smoke_test.sh bin lib
