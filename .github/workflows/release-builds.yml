name: Generate Global Binaries

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Purpose of this build run'
        type: choice
        required: true
        default: 'test'
        options:
          - 'test'
          - 'release'
      publish_release:
        description: 'Release runs only: publish the GitHub release at once, instead of leaving it as a draft to review'
        type: boolean
        required: false
        default: false

# Read-only by default; only the release job below can write (create the
# release and attach the zips).
permissions:
  contents: read

# =========================================================================
# CHANGE THIS SINGLE VARIABLE TO DEPLOY THIS WORKFLOW TO ANOTHER REPOSITORY
# =========================================================================
env:
  PROJECT_NAME: v32as

jobs:
  # Reads the version once, for every build job and the release, from the
  # '#define  VERSION  "..."' line of inc/v32as.h (anchored, as `make
  # version` writes it). It also checks that `make version` has stamped the
  # same version into src/ld.c (v32asld) and every manual page: a mismatch
  # is a warning on test builds and an error on release builds.
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse and Check Version
        id: parse
        shell: bash
        run: |
          HEADER_FILE="inc/${{ env.PROJECT_NAME }}.h"
          VERSION=$(sed -n 's/^#define[[:space:]]*VERSION[[:space:]]*"\(.*\)".*/\1/p' "$HEADER_FILE" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error file=$HEADER_FILE::could not read VERSION from $HEADER_FILE"
            exit 1
          fi
          case "$VERSION" in
            *[!A-Za-z0-9._+-]*)
              echo "::error file=$HEADER_FILE::VERSION '$VERSION' has characters unsafe for file names and tags"
              exit 1 ;;
          esac
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.build_type }}" = "release" ]; then LEVEL=error; else LEVEL=warning; fi
          STALE=0
          LD_VERSION=$(sed -n 's/^#define[[:space:]]*VERSION[[:space:]]*"\(.*\)".*/\1/p' src/ld.c | head -n 1)
          if [ "$LD_VERSION" != "$VERSION" ]; then
            echo "::$LEVEL file=src/ld.c::src/ld.c says $LD_VERSION, inc/v32as.h says $VERSION (run 'make version VERSION=$VERSION')"
            STALE=1
          fi
          for page in man/man*/*.[137] man/es/man1/*.1 man/fr/man1/*.1; do
            [ -f "$page" ] || continue
            if ! grep -q "^\.TH .*\"v32as[a-z]* $VERSION\"" "$page"; then
              echo "::$LEVEL file=$page::$page is not stamped with $VERSION (run 'make version VERSION=$VERSION')"
              STALE=1
            fi
          done
          if [ "$STALE" = 1 ] && [ "$LEVEL" = error ]; then exit 1; fi

      # A release run needs the release text; stop here, before the build
      # matrix starts, rather than when the release job looks for it.
      - name: Check the Release Text
        if: inputs.build_type == 'release'
        shell: bash
        run: |
          [ -f .github/release-notes.md ] || { echo "::error file=.github/release-notes.md::the release text is missing (is it committed?)"; exit 1; }

  # The lexer and parser are generated from src/lexer.l and src/parser.y and
  # are not committed. Generate them once, here, where flex and a bison >= 3
  # are a package away, and hand them to every build job: the Windows and VM
  # environments would need extra packages, and macOS's own bison (2.3) is
  # too old for parser.y. This job also runs the full regression suite
  # once, before anything is built for release (tests.yml runs it on
  # macOS too).
  generate:
    name: Generate Parser and Lexer, Run Tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flex and bison
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Build, Test and Lint the Manual Pages
        run: |
          make -j"$(nproc)" READLINE=0
          make test READLINE=0
          make mancheck

      - name: Stage the Generated Sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: |
            build/parser.tab.c
            build/parser.tab.h
            build/lexer.c
          retention-days: 1

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [version, generate]
    runs-on: ${{ matrix.os-runner }}

    # The OpenBSD and Haiku targets are a nice extra, not a requirement:
    # if one of them fails, the job still counts as passed, so the release
    # job below goes ahead with every package that did build.
    continue-on-error: ${{ matrix.optional == true }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}

    env:
      VERSION: ${{ needs.version.outputs.version }}
      # A release binary is relocatable: no compiled-in library directory
      # (v32as finds include/v32as/ beside itself), and no GNU readline
      # (libreadline is not on every system; the interactive mode works
      # without it, only without line editing). macOS keeps its system
      # libedit, which every Mac has.
      MAKE_FLAGS: LIBDIR= ${{ matrix.os == 'macos' && 'READLINE=auto' || 'READLINE=0' }}

    strategy:
      fail-fast: false
      matrix:
        # smoke: the binaries run on the runner itself (not cross-compiled),
        # so scripts/smoke_test.sh can check them from the package layout.
        # (The OpenBSD and Haiku builds are tested inside their virtual
        # machines instead.)
        include:
          # Windows Targets
          #   x86_64: MSYS2 UCRT64 (gcc) on the regular x64 runner.
          #   arm64:  MSYS2 CLANGARM64 (clang) on GitHub's native Windows
          #           ARM64 runner (UCRT64 has no aarch64 C runtime to
          #           cross-link against).
          - os: windows
            arch: x86_64
            os-runner: windows-latest
            msystem: UCRT64
            msys-packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make zip unzip
            smoke: true
          - os: windows
            arch: arm64
            os-runner: windows-11-arm
            msystem: CLANGARM64
            msys-packages: mingw-w64-clang-aarch64-clang make zip unzip
            smoke: true

          # macOS Targets (macos-latest is an Apple Silicon runner; the
          # x86_64 binary is cross-compiled there)
          - os: macos
            arch: x86_64
            os-runner: macos-latest
          - os: macos
            arch: arm64
            os-runner: macos-latest
            smoke: true

          # Linux Core Targets
          - os: linux
            arch: x86_64
            os-runner: ubuntu-latest
            smoke: true
          - os: linux
            arch: arm64
            os-runner: ubuntu-latest

          # Linux Raspberry Pi Targets
          - os: linux
            arch: armv7-rpi
            os-runner: ubuntu-latest
          - os: linux
            arch: armv8-rpi
            os-runner: ubuntu-latest

          # OpenBSD and Haiku Targets (optional): built inside a QEMU
          # virtual machine on a Linux runner by cross-platform-actions.
          - os: openbsd
            arch: x86_64
            os-runner: ubuntu-latest
            vm-arch: x86-64
            vm-version: '7.9'
            optional: true
          - os: openbsd
            arch: arm64
            os-runner: ubuntu-latest
            vm-arch: arm64
            vm-version: '7.9'
            optional: true
          - os: haiku
            arch: x86_64
            os-runner: ubuntu-latest
            vm-arch: x86-64
            vm-version: 'r1beta5'
            optional: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Put the generated parser and lexer in build/, and mark them newer
      # than src/parser.y and src/lexer.l, in dependency order, so make
      # uses them instead of running bison and flex.
      - name: Fetch the Generated Parser and Lexer
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: build
      - name: Use the Generated Parser and Lexer
        shell: bash
        run: |
          ls -l build
          touch build/parser.tab.c
          sleep 1
          touch build/parser.tab.h
          sleep 1
          touch build/lexer.c

      # --- ENVIRONMENT TOOLCHAIN SETUP ---
      - name: Setup MSYS2 Toolchain (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys-packages }}
      - name: Setup Linux ARM Cross-Compilers
        if: matrix.os == 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ] || [ "${{ matrix.arch }}" = "armv8-rpi" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          elif [ "${{ matrix.arch }}" = "armv7-rpi" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
          fi

      # --- BUILD EXECUTABLES & STRIP SYMBOLS ---
      # (gcc and clang name the Windows binaries bin/v32as.exe and
      # bin/v32asld.exe by themselves.)
      - name: Compile and Strip (Windows)
        if: matrix.os == 'windows'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            make $MAKE_FLAGS CC="clang"
            llvm-strip bin/*
          else
            mingw32-make $MAKE_FLAGS CC="gcc"
            strip bin/*
          fi
      - name: Compile and Strip (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          make $MAKE_FLAGS CC="clang -arch ${{ matrix.arch }}"
          strip bin/*
      - name: Compile and Strip (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ] || [ "${{ matrix.arch }}" = "armv8-rpi" ]; then
            make $MAKE_FLAGS CC="aarch64-linux-gnu-gcc"
            aarch64-linux-gnu-strip bin/*
          elif [ "${{ matrix.arch }}" = "armv7-rpi" ]; then
            make $MAKE_FLAGS CC="arm-linux-gnueabihf-gcc"
            arm-linux-gnueabihf-strip bin/*
          else
            make $MAKE_FLAGS CC="gcc"
            strip bin/*
          fi

      # The VM is only started for these targets; the next step runs inside
      # it (the checkout, with build/, is synced in, and bin/ back out).
      - name: Start Virtual Machine (OpenBSD / Haiku)
        if: matrix.os == 'openbsd' || matrix.os == 'haiku'
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          architecture: ${{ matrix.vm-arch }}
          version: ${{ matrix.vm-version }}

      # The Makefile needs GNU make, which OpenBSD doesn't ship (gmake is a
      # package), so the sources are compiled directly, with the flags the
      # Makefile uses (no readline, no compiled-in library directory).
      # Haiku keeps libm in libroot (no -lm). The smoke test runs here,
      # where the binaries can run.
      - name: Compile, Strip and Test (OpenBSD / Haiku)
        if: matrix.os == 'openbsd' || matrix.os == 'haiku'
        shell: cpa.sh {0}
        run: |
          uname -a
          if command -v cc >/dev/null 2>&1; then CC=cc; else CC=gcc; fi
          if [ "$(uname -s)" = Haiku ]; then LIBM=; else LIBM=-lm; fi
          FLAGS="-O2 -Wall -Wextra -std=gnu11 -Wno-unused-parameter -Iinc -Ibuild"
          mkdir -p bin
          $CC $FLAGS -Wno-sign-compare -Wno-unused-function \
              build/parser.tab.c build/lexer.c \
              src/asm.c src/tables.c src/heapstat.c src/pp.c src/ppexpr.c src/buildscript.c src/main.c \
              -o bin/${{ env.PROJECT_NAME }} $LIBM
          $CC $FLAGS src/ld.c -o bin/v32asld
          strip bin/${{ env.PROJECT_NAME }} bin/v32asld
          sh scripts/smoke_test.sh bin lib "${{ env.VERSION }}"

      # --- SMOKE TEST (NATIVE BUILDS) ---
      - name: Smoke Test (versions, %include from the package layout, link, -i)
        if: matrix.smoke == true
        run: sh scripts/smoke_test.sh bin lib "${{ env.VERSION }}"

      # --- MODULAR PACKAGING BLOCK (ALL OS RUNNERS) ---
      # The zip mirrors the Windows install layout under v32tools/, so it
      # can be unpacked straight into <Program Files>/Vircon32/v32tools
      # (beside v32lua, v32opt and v32c++) or anywhere else:
      #     v32as[.exe], v32asld[.exe]
      #     include/v32as/*.inc      the %include library: v32as finds it
      #                              here, next to itself
      #     docs/v32as/README.md     with README.es.md, README.fr.md, CHANGES.md,
      #                              LICENSE and docs/*.md (USAGE.md and its
      #                              es/fr translations)
      #     docs/v32as/man/man?/*    and the manual pages beside it, so
      #                              its links work (MANPATH=docs/v32as/man);
      #                              the Spanish and French man1 pages are in
      #                              docs/v32as/man/es/man1 and man/fr/man1
      # (Default shell: MSYS2's bash on Windows, which has the zip package
      # installed above; Git Bash, the runner's own "bash", has no zip.)
      - name: Create Zip Archive
        run: |
          if [ "${{ inputs.build_type }}" = "test" ]; then
            ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-test-${{ matrix.os }}-${{ matrix.arch }}.zip"
            echo "RETENTION_DAYS=2" >> $GITHUB_ENV
          else
            ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
            echo "RETENTION_DAYS=0" >> $GITHUB_ENV
          fi
          echo "Packaging: $ZIP_NAME"

          PKG=package
          DOCS="$PKG/docs/${{ env.PROJECT_NAME }}"
          rm -rf "$PKG"
          mkdir -p "$PKG/include/${{ env.PROJECT_NAME }}" "$DOCS/docs"
          cp bin/* "$PKG/"
          cp lib/*.inc "$PKG/include/${{ env.PROJECT_NAME }}/"
          cp README*.md CHANGES.md LICENSE "$DOCS/"
          cp docs/*.md "$DOCS/docs/"
          cp -R man "$DOCS/"

          # the Spanish and French documents are expected; say so if one is missing
          for f in README.es.md README.fr.md docs/USAGE.es.md docs/USAGE.fr.md \
                   man/es/man1/v32as.1 man/es/man1/v32asld.1 man/fr/man1/v32as.1 man/fr/man1/v32asld.1; do
            [ -f "$f" ] || echo "::warning::$f is missing from the package"
          done

          ls "$PKG/include/${{ env.PROJECT_NAME }}"/*.inc >/dev/null 2>&1 || {
            echo "::error::no %include library files were packaged"; exit 1; }

          cd "$PKG"
          zip -r "../$ZIP_NAME" ./*
          cd ..
          unzip -l "$ZIP_NAME"

          echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      # --- STAGE ZIP INTERNALLY ---
      - name: Upload Compressed Target Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-package-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.FINAL_ZIP_NAME }}
          retention-days: ${{ fromJson(env.RETENTION_DAYS) }}

  # The release page. For a `release` run this attaches every platform's zip
  # to a GitHub release "v<VERSION>", together with a SHA256SUMS.txt and the
  # text of .github/release-notes.md (its @VERSION@ becomes the version).
  #
  #   - The release is created as a DRAFT, visible only to people who can
  #     write to the repository, so the text and the zips can be reviewed
  #     before anyone sees them: press "Publish release" on the Releases
  #     page. Start the run with `publish_release` ticked to publish at once.
  #   - It is created for the commit that was built (target_commitish): the
  #     tag v<VERSION> is made at that commit.
  #   - A -dev version is marked a pre-release (never "Latest").
  #   - Running it again for the same version updates that release and
  #     replaces the zips of the same names.
  #   - This is the only job that can write to the repository.
  release:
    name: ${{ inputs.publish_release && 'Publish Release' || 'Create Draft Release' }}
    needs: [version, build]
    if: inputs.build_type == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Only .github/ (the release text) is needed from the repository.
      - name: Checkout the release text
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Download all zip packages from build jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ env.PROJECT_NAME }}-package-*
          merge-multiple: true

      # The OpenBSD and Haiku packages are optional; every other target
      # must be here, or the release would silently go out missing one.
      - name: Check the Packages
        shell: bash
        run: |
          MISSING=0
          for target in windows-x86_64 windows-arm64 macos-x86_64 macos-arm64 \
                        linux-x86_64 linux-arm64 linux-armv7-rpi linux-armv8-rpi; do
            zip="artifacts/${{ env.PROJECT_NAME }}-${VERSION}-${target}.zip"
            [ -f "$zip" ] || { echo "::error::$zip is missing"; MISSING=1; }
          done
          [ "$MISSING" = 0 ]
          ls -l artifacts

      - name: Write the Checksums and the Release Text
        shell: bash
        run: |
          [ -f .github/release-notes.md ] || { echo "::error file=.github/release-notes.md::the release text is missing"; exit 1; }
          (cd artifacts && sha256sum -- *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed "s|@VERSION@|${VERSION}|g" .github/release-notes.md > release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "${{ env.PROJECT_NAME }} Release v${{ needs.version.outputs.version }}"
          body_path: release-notes.md
          draft: ${{ !inputs.publish_release }}
          prerelease: ${{ contains(needs.version.outputs.version, '-dev') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
